name: Safe Portfolio Update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash verify-portfolio.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-projects.json career/reports
          git diff --cached --quiet || git commit -m "chore: safe portfolio maintenance"
          git push
