name: Career Intelligence
on:
  schedule:
    - cron: '23 7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/job_intelligence.py
      - run: python scripts/application_report.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add career/reports
          git diff --cached --quiet || git commit -m "chore: refresh career reports"
          git push
