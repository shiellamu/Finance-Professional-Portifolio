name: General Portfolio Sync
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/sync_projects.py
      - name: Commit index when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-projects.json
          git diff --cached --quiet || git commit -m "chore: refresh portfolio project index"
          git push
